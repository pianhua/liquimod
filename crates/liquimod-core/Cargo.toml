[package]
name = "liquimod-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
junction = "1"
zip = { version = "8.6.0", features = ["aes-crypto", "deflate"] }
sevenz-rust2 = { version = "0.21.5", features = ["aes256", "util"] }
unrar = "0.5.8"

[dev-dependencies]
tempfile = "3"
