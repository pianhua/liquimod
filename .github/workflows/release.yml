name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Frontend Dependencies
        working-directory: app
        run: npm ci

      - name: Build Frontend
        working-directory: app
        run: npm run build

      - name: Build Refresh Helper Release
        run: cargo build --release -p liquimod-refresh-helper

      - name: Build LiquiMod App Release
        run: cargo build --release --features tauri/custom-protocol --manifest-path app/src-tauri/Cargo.toml

      - name: Assemble Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/LiquiMod" | Out-Null
          Copy-Item -Path "target/release/liquimod-app.exe" -Destination "dist/LiquiMod/"
          Copy-Item -Path "target/release/liquimod-refresh-helper.exe" -Destination "dist/LiquiMod/"
          if (Test-Path "README.md") {
            Copy-Item -Path "README.md" -Destination "dist/LiquiMod/"
          }
          Compress-Archive -Path "dist/LiquiMod" -DestinationPath "LiquiMod-Windows-x64.zip" -Force
          $hash = (Get-FileHash -Path "LiquiMod-Windows-x64.zip" -Algorithm SHA256).Hash
          "$hash  LiquiMod-Windows-x64.zip" | Out-File -FilePath "LiquiMod-Windows-x64.zip.sha256" -Encoding utf8

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiquiMod-Windows-x64
          path: |
            LiquiMod-Windows-x64.zip
            LiquiMod-Windows-x64.zip.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LiquiMod-Windows-x64.zip
            LiquiMod-Windows-x64.zip.sha256
          generate_release_notes: true
